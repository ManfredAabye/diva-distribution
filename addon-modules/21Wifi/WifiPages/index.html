<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />
    <meta http-equiv="Content-Script-Type" content="text/javascript" /><!-- W3C wants this -->
    <title><!-- #get var=GridName --></title>
    <!-- #call method=GetRefresh -->
    <link rel="shortcut icon" href="/wifi/images/favicon.ico" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/w3.css" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-custom.css" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-config.css" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/console.css" />
    <!-- The following embedded style MUST be the last one defined -->
    <!-- in order to work with the remote console.                 -->
    <style type="text/css">
    /* <![CDATA[ */
    #console #messages {
      overflow:auto;
    }
    /* ]]> */
    </style>

    <!-- #include file=jsglobals.html -->
    <script src="/wifi/scripts/jquery-1-9-1-min.js" type="text/javascript"></script>
    <script src="/wifi/scripts/global.js" type="text/javascript"></script>
    
  </head>

  <body class="w3-black">

    <!-- Header -->
    <header class="w3-container w3-deep-orange w3-center">
      <h1><!-- #get var=GridName --></h1>
    </header>

    <!-- Page Container (weißer Hintergrund) -->
    <div class="wifi-main w3-white">
      <div class="wifi-row">

        <!-- Sidebar/Navigation (Grau, 1/3) -->
        <div class="wifi-sidebar">
          
          <!-- Header -->
          <div class="wifi-sidebar-header">
            <h2><!-- #get var=GridName --></h2>
            <p class="w3-text-light-gray">Virtual World</p>
          </div>

          <!-- Hauptmenü -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Main Menu</h5>
              <!--#call method=GetMainMenu --> 
            </div>
          </div>

          <!-- Erweiterungen -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Add-ons</h5>
              <!--#call method=GetAddonsMenu -->
            </div>
          </div>

          <!-- Login/Logout -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Account</h5>
              <!--#call method=GetLoginLogout --> 
            </div>
          </div>

          <!-- Links -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Links</h5>
              <!--#include file=links.html --> 
            </div>
          </div>

        </div>
        <!-- Ende Sidebar -->

        <!-- Content (Weiß, 2/3) -->
        <div class="wifi-content">
          <!-- Schwarze Card für Content -->
          <div class="w3-card w3-black w3-margin">
            <div class="w3-container w3-padding-32">
              <!--#include file=content-box.html --> 
            </div>
          </div>
        </div>
        <!-- Ende Content -->

      </div>
    </div>
    <!-- Ende Page Container -->

    <!-- Footer -->
    <footer class="w3-container w3-deep-orange w3-center w3-margin-top">
      <!-- #include file=footer.html -->
    </footer>

  </body>
</html>
