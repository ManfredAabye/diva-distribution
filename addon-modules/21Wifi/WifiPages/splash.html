<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
    <title><!-- #get var=GridName --></title>
    <link rel="shortcut icon" href="/wifi/images/favicon.ico" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/w3.css" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-custom.css" />
    <link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-config.css" />
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />
  </head>
  <body class="w3-black">

    <!-- Header -->
    <header class="w3-container w3-deep-orange w3-center">
      <h1><!-- #get var=GridName --></h1>
    </header>

    <!-- Page Container -->
    <div class="wifi-main w3-white">
      <div class="wifi-row">

        <!-- Sidebar (Grau, 1/3) -->
        <div class="wifi-sidebar">
          
          <!-- Header -->
          <div class="wifi-sidebar-header">
            <h2><!-- #get var=GridName --></h2>
            <p class="w3-text-light-gray">Virtual World</p>
          </div>

          <!-- Hauptmenü -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Main Menu</h5>
              <!--#call method=GetMainMenu --> 
            </div>
          </div>

          <!-- Erweiterungen -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Add-ons</h5>
              <!--#call method=GetAddonsMenu -->
            </div>
          </div>

          <!-- Login/Logout -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Account</h5>
              <!--#call method=GetLoginLogout --> 
            </div>
          </div>

          <!-- Links -->
          <div class="wifi-sidebar-section">
            <div class="wifi-container">
              <h5 class="w3-text-orange">Links</h5>
              <!--#include file=links.html --> 
            </div>
          </div>

        </div>
        <!-- Ende Sidebar -->

        <!-- Content (Weiß, 2/3) -->
        <div class="wifi-content">
          
          <!-- Welcome Section - Schwarze Card -->
          <div class="w3-card w3-black w3-margin">
            
            <div class="w3-container w3-padding-32 w3-center">
              <!--#include file=content-box.html --> 
            </div>

            <!-- Bild - Höhe anpassend, Breite dynamisch -->
            <div class="w3-container w3-center">
              <img src="/wifi/images/orange-planets-background.jpg" style="height:auto; max-height:600px; width:auto; max-width:100%;" class="w3-round w3-margin-bottom" />
            </div>
            
            <!-- Statistiken - 4 Cards nebeneinander -->
            <div class="w3-container w3-padding-16 w3-center">
              <div class="w3-row-padding">
                <div class="w3-quarter">
                  <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
                    <h3 class="w3-text-orange" style="margin: 8px 0;"><!-- #get var=UsersInworld --></h3>
                    <p class="w3-text-white" style="margin: 4px 0; font-size: 14px;">Online</p>
                  </div>
                </div>
                <div class="w3-quarter">
                  <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
                    <h3 class="w3-text-orange" style="margin: 8px 0;"><!-- #get var=RegionsTotal --></h3>
                    <p class="w3-text-white" style="margin: 4px 0; font-size: 14px;">Regions</p>
                  </div>
                </div>
                <div class="w3-quarter">
                  <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
                    <h3 class="w3-text-orange" style="margin: 8px 0;"><!-- #get var=UsersTotal --></h3>
                    <p class="w3-text-white" style="margin: 4px 0; font-size: 14px;">Total Users</p>
                  </div>
                </div>
                <div class="w3-quarter">
                  <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
                    <h3 class="w3-text-orange" style="margin: 8px 0;"><!-- #get var=UsersActive --></h3>
                    <p class="w3-text-white" style="margin: 4px 0; font-size: 14px;">Active (<!-- #get var=UsersActivePeriod --> Days)</p>
                  </div>
                </div>
              </div>
            </div>

          </div>
          <!-- Ende schwarze Card -->

        </div>
        <!-- Ende Content -->

      </div>
    </div>
    <!-- Ende Page Container -->

    <!-- Footer -->
    <footer class="w3-container w3-deep-orange w3-center w3-margin-top">
      <p>
        <img class="logo" src="/wifi/images/diva.png" alt="Diva Distro" style="height:40px;margin:8px;">
        <a href="http://opensimulator.org"><img class="logo" src="/wifi/images/PoweredByOS.png" alt="Powered by OpenSimulator" style="height:40px;margin:8px;"></a>
      </p>
      <!-- #include file=footer.html -->
    </footer>

  </body>
</html>
