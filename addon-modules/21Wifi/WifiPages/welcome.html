<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
  <head>
	<title><!-- #get var=GridName --></title>
	<link rel="shortcut icon" href="/wifi/images/favicon.ico" />
	<link rel="stylesheet" media="screen" type="text/css" href="/wifi/w3.css" />
	<link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-custom.css" />
	<link rel="stylesheet" media="screen" type="text/css" href="/wifi/wifi-config.css" />
  <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />
  </head>

  <body class="w3-black">

    <!-- Header -->
    <header class="w3-container w3-deep-orange w3-center">
      <h1><!-- #get var=GridName --></h1>
    </header>

    <!-- Simple Welcome Page (ohne Sidebar) - Schwarze Card -->
    <div class="w3-container w3-padding-64 w3-center">
      
      <div class="w3-content w3-card w3-black w3-padding-32" style="max-width:800px">
        <h1 class="w3-text-orange"><!-- #get var=GridName--></h1>
        <p class="w3-text-gray w3-large">Virtual World</p>
        
        <div class="w3-margin-top w3-margin-bottom">
          <img src="/wifi/images/orange-planets-background.jpg" style="height:auto; max-height:500px; width:auto; max-width:100%;" class="w3-round">
        </div>

        <!-- Statistiken -->
        <div class="w3-row-padding w3-margin-top">
          <div class="w3-quarter">
            <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
              <h3 class="w3-text-orange"><!-- #get var=UsersInworld --></h3>
              <p class="w3-small w3-text-white">Online</p>
            </div>
          </div>
          <div class="w3-quarter">
            <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
              <h3 class="w3-text-orange"><!-- #get var=RegionsTotal --></h3>
              <p class="w3-small w3-text-white">Regions</p>
            </div>
          </div>
          <div class="w3-quarter">
            <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
              <h3 class="w3-text-orange"><!-- #get var=UsersTotal --></h3>
              <p class="w3-small w3-text-white">Users</p>
            </div>
          </div>
          <div class="w3-quarter">
            <div class="w3-card w3-black w3-padding w3-round" style="border: 2px solid var(--wifi-orange);">
              <h3 class="w3-text-orange"><!-- #get var=UsersActive --></h3>
              <p class="w3-small w3-text-white">Active</p>
            </div>
          </div>
        </div>

        <div class="w3-margin-top w3-padding-32">
          <a href="http://opensimulator.org">
            <img src="/wifi/images/PoweredByOS.png" alt="Powered by OpenSimulator" style="max-width:300px;">
          </a>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <footer class="w3-container w3-deep-orange w3-center w3-margin-top">
      <p>&copy; <!-- #get var=GridName --></p>
    </footer>

  </body>
</html>
