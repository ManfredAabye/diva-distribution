; This is the main configuration file for an instance of OpenSim running in grid mode

[DatabaseService]
    ;
    ; ### Choose the DB
    ;    

    ; SQLite - Original OpenSim Configuration
    StorageProvider = "Diva.Data.SQLite.dll"

    ; MySQL - Migrated from Diva Configuration
    ; Uncomment these lines if you want to use MySQL storage
    ; Change the connection string to your db details
    ; Remove SslMode=None if you need secure connection to the local MySQL
    ; In most cases ssl is just a pure waste of resources, specially when MySQL is on same machine, and closed to outside
    ;StorageProvider = "Diva.Data.MySQL.dll"
    ;StorageProvider = "OpenSim.Data.MySQL.dll"
    ; If using MySQL 8.0.4 or later, check that default-authentication-plugin=mysql_native_password
    ;  rather than caching_sha2_password is set in /etc/mysql/mysql.conf.d/mysqld.cnf (not applicable to MariaDB).
    ;ConnectionString = "Data Source=localhost;Database=opensim;User ID=opensim;Password=***;Old Guids=true;SslMode=None;"

    ; Uncomment this line if you are using MySQL and want to use a different database for estates
    ; The usual application for this is to allow estates to be spread out across multiple simulators by share the same database.
    ; Most people won't need to do this so only uncomment if you know what you're doing.
    ;EstateConnectionString = "Data Source=localhost;Database=opensim;User ID=opensim;Password=***;Old Guids=true;SslMode=None;"

    ; MSSQL
    ; Uncomment these lines if you want to use MSSQL storage
    ; Change the connection string to your db details
    ; The value for server property is shown in your SQL Server Management Studio login dialog.
    ; (This sample is the default of express edition)
    ;StorageProvider = "OpenSim.Data.MSSQL.dll"
    ;ConnectionString = "Server=localhost\SQLEXPRESS;Database=opensim;User Id=opensim; password=***;"

    ; PGSQL
    ; Uncomment these lines if you want to use PGSQL storage
    ; Change the connection string to your db details
    ;StorageProvider = "OpenSim.Data.PGSQL.dll"
    ;ConnectionString = "Server=localhost;Database=opensim;User Id=opensim; password=***; SSL Mode=Disable"

[Hypergrid]
    ; Uncomment the variable GatekeeperURI in this section to enable
    ; Hypergrid configuration. Otherwise, ignore.

    ;# {GatekeeperURI} {Hypergrid} {The URL of the gatekeeper of this world} {}
    ;; If this is a standalone world, this is the address of this instance.
    ;; If this is a grided simulator, this is the address of the external robust server
    ;; that runs the Gatekeeper service.
    ;; For example http://myworld.com:9000 or http://myworld.com:8002
    ; Original OpenSim setting:
    ; GatekeeperURI = "${Const|BaseURL}:${Const|PublicPort}"
    
    ; Migrated from Diva MyWorld.ini configuration:
    GatekeeperURI = "http://127.0.0.1:9000"

    ;# {GatekeeperURIAlias} {Hypergrid} {alternative hostnames (FQDN), or IPs of the gatekeeper of this world and port} {}
    ;; comma separated list, 
    ;; in case there was for example a dns change, etc
    ; GatekeeperURIAlias = myoldname.something.org

    ;# {HomeURI} {Hypergrid} {The Home URL of this world} {}
    ;; If this is a standalone world, this is the address of this instance.
    ;; If this is a grided simulator, this is the address of the external robust server that
    ;; runs the UserAgentsService.
    ;; For example http://myworld.com:9000 or http://myworld.com:8002
    HomeURI = "${Const|BaseURL}:${Const|PublicPort}"

    ;# {HomeURIAlias} {Hypergrid} {Old http schema (default http://), hostnames (FQDN), or IPs of the gatekeeper of this world and port (default 80 or 443)} {}
    ;; comma separated list, 
    ;; in case there was for example a dns change, etc but it is still same grid
    ; HomeURIAlias = myoldname.something.org, 127.0.0.1,127.0.0.1:8043


[Modules]
    ;; Asset cache module.
    ;; Warning this is required for several region features

    AssetCaching = "FlotsamAssetCache"
    Include-FlotsamCache = "config-include/FlotsamCache.ini"

    ;; Optionally, the port for the LLProxyLoginModule module can be changed
    ;Setup_LLProxyLoginModule = "9090/"

    ;; Authorization is not on by default, as it depends on external php
    ;AuthorizationServices = "RemoteAuthorizationServicesConnector"

[AssetService]
    DefaultAssetLoader = "OpenSim.Framework.AssetLoader.Filesystem.dll"
    AssetLoaderArgs = "assets/AssetSets.xml"

    ;
    ; Change this to your grid-wide asset server.  Do not add a slash to the end of any of these addresses.
    ;
    AssetServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[InventoryService]
    ;
    ; Change this to your grid-wide inventory server
    ;
    InventoryServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    ;MaxRetries = 0

[GridInfo]
    ;
    ; Change this to your grid info service
    ;
    GridInfoURI = "${Const|BaseURL}:${Const|PublicPort}"

[GridService]
    ;
    ; Change this to your grid-wide grid server
    ;
    GridServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    ;AllowHypergridMapSearch = true

    ;; Directory for map tile images of linked regions
    ; MapTileDirectory = "./maptiles"

    ; === HG ONLY ===
    ;; Change this to the address of your Gatekeeper service
    ;; (usually bundled with the rest of the services in one
    ;; Robust server in port ${Const|PublicPort}, but not always)
    Gatekeeper="${Const|BaseURL}:${Const|PublicPort}"

[EstateDataStore]
    ;
    ; Uncomment if you want centralized estate data at robust server,
    ; in which case the URL in [EstateService] will be used
    ;
    ;LocalServiceModule = "OpenSim.Services.Connectors.dll:EstateDataRemoteConnector"

[EstateService]
    EstateServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[Messaging]
    ; === HG ONLY ===
    ;; Change this to the address of your Gatekeeper service
    ;; (usually bundled with the rest of the services in one
    ;; Robust server in port ${Const|PublicPort}, but not always)
    Gatekeeper = "${Const|BaseURL}:${Const|PublicPort}"

[AvatarService]
    ;
    ; Change this to your grid-wide grid server
    ;
    AvatarServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AgentPreferencesService]
    ;
    ; Change this to your grid-wide avatar prefs server
    ;
    AgentPreferencesServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[PresenceService]
    ;
    ; Change this to your grid-wide presence server
    ;
    PresenceServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[UserAccountService]
    ;
    ; Change this to your grid-wide user accounts server
    ;
    UserAccountServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[GridUserService]
    ;
    ; Change this to your grid-wide user server
    ;
    GridUserServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AuthenticationService]
    ;
    ; Change this to your grid-wide authentication server
    ;
    AuthenticationServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[FriendsService]
    ;
    ; Change this to your grid-wide friends server
    ;
    FriendsServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[HGInventoryAccessModule]
    ;
    ; === HG ONLY ===
    ; Change this to your server
    ; accessible from other grids
    ;
    ;; If you want to protect your assets from being copied by foreign visitors
    ;; set this to false. You may want to do this on sims that have licensed content.
    ;; Default is true.
    ; OutboundPermission = True

    ;; Send visual reminder to local users that their inventories are unavailable while they are traveling
    ;; and available when they return. True by default.
    ;RestrictInventoryAccessAbroad = True

    ;; Warning: advanced and unusual. Default is false.
    ;; Enables configurations where grids share user services, including inventory,
    ;; while separating regions' assets from users' assets. Asset transfer between
    ;; the users' asset server and the regions' asset server is done in HG-like manner.
    ; CheckSeparateAssets = false
    ; RegionHGAssetServerURI = ${Const|BaseURL}:${Const|PublicPort}


[HGAssetService]
    ;
    ; === HG ONLY ===
    ;; The asset types that this grid can export to / import from other grids.
    ;; Comma separated.
    ;; Valid values are all the asset types in OpenMetaverse.AssetType, namely:
    ;; Unknown, Texture, Sound, CallingCard, Landmark, Clothing, Object, Notecard, LSLText,
    ;; LSLBytecode, TextureTGA, Bodypart, SoundWAV, ImageTGA, ImageJPEG, Animation, Gesture, Mesh
    ;;
    ;; Leave blank or commented if you don't want to apply any restrictions.
    ;; A more strict, but still reasonable, policy may be to disallow the exchange
    ;; of scripts, like so:
    ; DisallowExport ="LSLText"
    ; DisallowImport ="LSLBytecode"

[HGFriendsModule]
    ; User level required to be able to send friendship invitations to foreign users
    ;LevelHGFriends = 0;

[MapImageService]
    MapImageServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

[AuthorizationService]
  ; If you have regions with access restrictions
    ; specify them here using the convention
    ; Region_<Region_Name> = <flags>
    ; Valid flags are:
    ; DisallowForeigners -- HG visitors not allowed
    ; DisallowResidents -- only Admins and Managers allowed
    ; Example:
    ; Region_Test_1 = "DisallowForeigners"

;;
;; ===== DIVA CONFIGURATION MIGRATION =====
;; The following sections are migrated from DivaPreferences.ini and MyWorld.ini
;; to maintain compatibility with Diva Distribution functionality
;;

[Network]
    ; Migrated from MyWorld.ini
    http_listener_port = 9000

[GridService]
    ; Migrated from MyWorld.ini - Default regions configuration
    Region_My_World_1 = "DefaultRegion, DefaultHGRegion, FallbackRegion"
    Region_My_World = "DefaultRegion, DefaultHGRegion, FallbackRegion"

[HGAssetService]
    ; Migrated from MyWorld.ini
    HomeURI = "http://127.0.0.1:9000"

[HGInventoryAccessModule]
    ; Migrated from MyWorld.ini
    ;; If you want to protect your assets from being copied by foreign visitors
    ;; uncomment the next line. You may want to do this on sims that have licensed content.
    ; OutboundPermission = False

[DataSnapshot]
    ; Migrated from DivaPreferences.ini and MyWorld.ini
    index_sims = true
    data_exposure = minimum
    ; 1 hour
    default_snapshot_period = 3600
    snapshot_cache_directory = "DataSnapshot"
    gridname = "My World"
    ;DATA_SRV_MISearch="http://metaverseink.com/cgi-bin/register.py"

[UserProfiles]
    ; Migrated from MyWorld.ini
    ProfileServiceURL = "http://127.0.0.1:9000"

[LoginService]
    ; Migrated from MyWorld.ini
    WelcomeMessage = "Welcome!"
    SRV_HomeURI = "http://127.0.0.1:9000"    
    SRV_InventoryServerURI = "http://127.0.0.1:9000"
    SRV_AssetServerURI = "http://127.0.0.1:9000"
    SRV_FriendsServerURI = "http://127.0.0.1:9000"
    SRV_IMServerURI = "http://127.0.0.1:9000"
    SRV_GroupsServerURI = "http://127.0.0.1:9000"
    SRV_ProfileServerURI = "http://127.0.0.1:9000"
    ;; For Viewer 2
    MapTileURL = "http://127.0.0.1:9000/"

[GatekeeperService]
    ; Migrated from MyWorld.ini
    ;; HG 2.0 access control
    ;; Restrictions on origin of foreign visitors.
    ;; Are foreign visitors allowed?
    ; ForeignAgentsAllowed = true
    ;;
    ;; If ForeignAgentsAllowed is true, make exceptions using AllowExcept.
    ;; Leave blank or commented for no exceptions.
    ; AllowExcept = "http://griefer.com:8002, http://enemy.com:8002"
    ;;
    ;; If ForeignAgentsAllowed is false, make exceptions using DisallowExcept
    ;; Leave blank or commented for no exceptions.
    ; DisallowExcept = "http://myfriendgrid.com:8002, http://myboss.com:8002"

[UserAgentService]
    ; Migrated from MyWorld.ini
    ;; HG 2.0 access control
    ; User level required to be contacted from other grids
    ;LevelOutsideContacts = 0
    ;; Restrictions on destinations of local users.
    ;; Are local users allowed to visit other grids?
    ;; What user level? Use variables of this forrm:
    ;; ForeignTripsAllowed_Level_<UserLevel> = true | false
    ;; For example:
    ; ForeignTripsAllowed_Level_0 = false
    ; ForeignTripsAllowed_Level_10 = true ; true is default
    ;;
    ;; If ForeignTripsAllowed is true, make exceptions using AllowExcept.
    ;; Leave blank or commented for no exceptions.
    ; AllowExcept_Level_10 = "http://griefer.com:8002, http://enemy.com:8002"
    ;;
    ;; If ForeignTripsAllowed is false, make exceptions using DisallowExcept
    ;; Leave blank or commented for no exceptions.
    ; DisallowExcept_Level_0 = "http://myfriendgrid.com:8002, http://myboss.com:8002"

[GridInfoService]
    ; Migrated from MyWorld.ini
    login = http://127.0.0.1:9000/
    gridname = "My World"
    gridnick = "hippogrid"
    welcome = http://127.0.0.1:9000/wifi/welcome.html
    register = http://127.0.0.1:9000/wifi/user/account
    password = http://127.0.0.1:9000/wifi/forgotpassword
    gatekeeper = http://127.0.0.1:9000/
    uas = http://127.0.0.1:9000/

[WifiService]
    ; Migrated from MyWorld.ini
    GridName = "My World"
    LoginURL = "http://127.0.0.1:9000"
    WebAddress = "http://127.0.0.1:9000"
	
    ;; The Wifi Administrator account
    AdminFirst = "Wifi"
    AdminLast = "Administrator"
    AdminEmail = "admin@localhost"
    AdminPassword = "secret"

    ;; Do you want to be able to control grid registrations?
    AccountConfirmationRequired = true

    ;; Variables for your mail server
    ;; Users will get email notifications from this account.
    SmtpHost = "smtp.gmail.com"
    SmtpPort = "587"
    SmtpUsername = "your_email@gmail.com"
    SmtpPassword = "secret"

    HomeLocation = "My_World"

    ;; Who can upload IARs? Set the UserLevel of accounts in order to restrict
    ;; this feature. Default is 0 (everyone can do it)
    ; IARUserLevel = 0

[TOSModule]
    ; Migrated from MyWorld.ini
    ;; Disabled by default. Disable it if you like by setting this to false
    Enabled = false
    ;; Tell the users what this is about
    Message = "Please read and agree to the Terms of Service"
    ;; Should local users be shown the TOS on first login?
    ShowToLocalUsers = false
    ;; Should foreign users be shown the TOS on first HG login?
    ShowToForeignUsers = true
    ;; Change the text on that page for your own TOS.
    ;; You'll find it under <your diva dir>/WifiPages/tos.html
    TOS_URL = "http://127.0.0.1:9000/wifi/tos.html"

[Groups]
    ; Migrated from MyWorld.ini
    GroupsExternalURI = "http://127.0.0.1:9000"


[MuteListService]
    MuteListServerURI = "${Const|PrivURL}:${Const|PrivatePort}"

