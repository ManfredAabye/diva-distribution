; These are the initialization settings for running OpenSim Standalone with an SQLite database

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ; Main database using ADO.NET connection string format
    ConnectionString = "Data Source=OpenSim.db;Version=3;UseUTF16Encoding=True"

[AssetService]
    ConnectionString = "Data Source=Asset.db;Version=3"

; The HGAssetService section controls the connection given to the AssetService in a Hypergrid configuration.
; This has to be separate from [AssetService] because the Hypergrid facing connector uses [HGAssetService] for its config data instead.
; However, the internal asset service will still use the [AssetService] section.
; Therefore, you will almost certainly want the ConnectionString in [HGAssetService] to be the same as in [AssetService] 
; so that they both access the same database.
; This issue does not apply to normal MySQL/MSSQL configurations, since by default they use the settings in [DatabaseService] and
; do not have separate connection strings for different services.
[HGAssetService]
    ConnectionString = "Data Source=Asset.db;Version=3"

[InventoryService]
    ;ConnectionString = "Data Source=inventory.db;Version=3"
    ; if you have a legacy inventory store use the connection string below
    ConnectionString = "Data Source=inventory.db;Version=3;UseUTF16Encoding=True"

[AvatarService]
    ConnectionString = "Data Source=avatars.db;Version=3"

[AuthenticationService]
    ConnectionString = "Data Source=auth.db;Version=3"

[UserAccountService]
    ; Using OpenSim.Data for database migrations, Diva.OpenSimServices for extended functionality
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "Data Source=OpenSim.db;Version=3;UseUTF16Encoding=True"

[GridUserService]
    ; Using OpenSim.Data for database migrations, Diva.OpenSimServices for extended functionality
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "Data Source=OpenSim.db;Version=3;UseUTF16Encoding=True"

[FriendsService]
    ; Using standard OpenSim provider for better compatibility
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "Data Source=OpenSim.db;Version=3;UseUTF16Encoding=True"

[GridService]
    ; For standalone mode, grid uses in-memory storage (Null provider)
    ; Regions are stored in memory by default
    ; If you need persistent region storage, uncomment the lines below:
    ; StorageProvider = "OpenSim.Data.SQLite.dll:SQLiteRegionData"
    ; ConnectionString = "URI=file:OpenSim.db,version=3,UseUTF16Encoding=True,Journal Mode=WAL,Synchronous=Normal,Cache Size=10000,Page Size=4096,Pooling=True,Max Pool Size=100,Busy Timeout=30000"

; Groups Service - use provider compatible with Groups implementation
; OpenSim.Data.SQLite.dll does not provide an IGroupsData implementation
; Wifi / Diva modules require Diva.Data for Groups functionality.
[Groups]
    StorageProvider = "Diva.Data.SQLite.dll"
    ConnectionString = "Data Source=OpenSim.db;Version=3;UseUTF16Encoding=True"

